name: Dotfiles CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run ShellCheck on install.sh
        run: shellcheck install.sh
      - name: Lint chezmoi scripts (bash -n after template strip)
        run: |
          for f in .chezmoiscripts/*.tmpl; do
            out="/tmp/$(basename "$f" .tmpl).sh"
            perl -0777 -pe 's/\{\{-?.*?-?\}\}//gs' "$f" > "$out"
            bash -n "$out"
            echo "OK: $f"
          done

  test-install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Run Install Script
        run: ./install.sh
        env:
          # Avoid interactive prompts if any (though scripts seem non-interactive)
          CI: true

      - name: Verify Installation
        run: |
          # Add local bin to PATH
          export PATH="$HOME/.local/bin:$PATH"

          echo "Verifying chezmoi installation..."
          if ! command -v chezmoi >/dev/null; then
            echo "::error::chezmoi not found in PATH"
            exit 1
          fi

          echo "Verifying pi-bolt..."
          if ! command -v pi-bolt >/dev/null; then
            echo "::error::pi-bolt not found in PATH"
            exit 1
          fi
          pi-bolt --version

          echo "Verifying Gondolin sandbox extension (Linux)..."
          if [ "${{ runner.os }}" == "Linux" ]; then
            EXT="$HOME/.pi/agent/extensions/gondolin"
            if [ ! -f "$EXT/index.ts" ] || [ ! -f "$EXT/package.json" ]; then
              echo "::error::Gondolin extension files were not applied"
              exit 1
            fi
            grep -q "aliyuncs.com" "$EXT/index.ts" || {
              echo "::error::Gondolin network deny list (aliyuncs.com) not found in $EXT/index.ts"
              exit 1
            }
            grep -q '"pi"' "$EXT/package.json" || {
              echo "::error::Gondolin package.json is missing the pi.extensions manifest"
              exit 1
            }
            grep -q "GONDOLIN_CONFIRM_HOSTS" "$EXT/index.ts" || {
              echo "::error::Gondolin ask-on-first-target prompt hook missing"
              exit 1
            }
            grep -q "SSH_AUTH_SOCK" "$EXT/index.ts" || {
              echo "::error::Gondolin SSH exec policy hook missing"
              exit 1
            }
            grep -q "host_cli" "$EXT/index.ts" || {
              echo "::error::Gondolin host_cli passthrough tool missing"
              exit 1
            }
            echo "Gondolin extension applied with the default network deny list."
          fi

          echo "Verifying shell configs are managed by chezmoi and contain PI_OFFLINE..."
          if [ "${{ runner.os }}" == "Linux" ]; then
            for rc in "$HOME/.bashrc" "$HOME/.zshrc"; do
              if [ ! -f "$rc" ]; then
                echo "::error::$rc not found"
                exit 1
              fi
              grep -q "managed by chezmoi" "$rc" || {
                echo "::error::$rc not managed by chezmoi"
                exit 1
              }
              grep -q "PI_OFFLINE" "$rc" || {
                echo "::error::PI_OFFLINE not set in $rc"
                exit 1
              }
            done
          elif [ "${{ runner.os }}" == "macOS" ]; then
            if [ ! -f "$HOME/.zshrc" ]; then
              echo "::error::.zshrc not found"
              exit 1
            fi
            grep -q "managed by chezmoi" "$HOME/.zshrc" || {
              echo "::error::.zshrc not managed by chezmoi"
              exit 1
            }
            grep -q "PI_OFFLINE" "$HOME/.zshrc" || {
              echo "::error::PI_OFFLINE not set in $HOME/.zshrc"
              exit 1
            }
          fi

          echo "Verifying Homebrew..."
          if [ "${{ runner.os }}" == "Linux" ]; then
             # Linuxbrew might need to be sourced
             if [ -d "/home/linuxbrew/.linuxbrew" ]; then
               eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
             elif [ -d "$HOME/.linuxbrew" ]; then
               eval "$($HOME/.linuxbrew/bin/brew shellenv)"
             fi
          fi

          if command -v brew >/dev/null; then
            echo "brew is available."
            brew list
          else
            echo "::warning::brew not found or not in PATH."
          fi

          echo "Verifying applied state with chezmoi verify..."
          chezmoi verify --source "$GITHUB_WORKSPACE" --exclude=scripts

      - name: Idempotency Check
        run: ./install.sh
        env:
          CI: true

  test-devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      - name: Build and Run Dev Container
        run: |
          # Start the dev container.
          # This will run the onCreateCommand (./install.sh) inside the container.
          devcontainer up --workspace-folder .
        env:
          CI: true

      - name: Verify Dev Container Setup
        run: |
          # Check for chezmoi, pi-bolt, and shell configs inside the container.
          # zsh is the default shell, so .zshrc must be present and managed.
          devcontainer exec --workspace-folder . bash -c "
            export PATH=\$HOME/.local/bin:\$PATH
            for bin in chezmoi pi-bolt; do
              if command -v \$bin >/dev/null; then
                echo \"\$bin found\";
              else
                echo \"\$bin not found\"; exit 1;
              fi
            done

            for rc in ~/.bashrc ~/.zshrc; do
              if [ -f \$rc ]; then
                echo \"\$rc found\";
                grep -q 'managed by chezmoi' \$rc || { echo \"\$rc not managed by chezmoi\"; exit 1; }
                grep -q 'PI_OFFLINE' \$rc || { echo \"PI_OFFLINE not set in \$rc\"; exit 1; }
              else
                echo \"\$rc not found\"; exit 1;
              fi
            done
          "
