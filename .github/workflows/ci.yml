name: Dotfiles CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run ShellCheck on install.sh
        run: shellcheck install.sh
      - name: Lint chezmoi scripts (bash -n after template strip)
        run: |
          for f in .chezmoiscripts/*.tmpl; do
            out="/tmp/$(basename "$f" .tmpl).sh"
            perl -0777 -pe 's/\{\{-?.*?-?\}\}//gs' "$f" > "$out"
            bash -n "$out"
            echo "OK: $f"
          done
      - name: Lint the managed fish config
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fish
          fish --no-execute dot_config/fish/config.fish
          echo "OK: dot_config/fish/config.fish"

  test-install:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Run Install Script
        run: ./install.sh
        env:
          # Avoid interactive prompts if any (though scripts seem non-interactive)
          CI: true

      - name: Verify Installation
        run: |
          # Add local bin to PATH
          export PATH="$HOME/.local/bin:$PATH"

          echo "Verifying chezmoi installation..."
          if ! command -v chezmoi >/dev/null; then
            echo "::error::chezmoi not found in PATH"
            exit 1
          fi

          echo "Verifying pi-bolt..."
          if ! command -v pi-bolt >/dev/null; then
            echo "::error::pi-bolt not found in PATH"
            exit 1
          fi
          pi-bolt --version

          echo "Verifying Pi-Bolt agent dir migration..."
          # Pi-Bolt's agent dir follows PI_CODING_AGENT_DIR (the dotfiles set it to
          # ~/.config/pi/agent in the shell rc; chezmoi's own scripts export it too).
          AGENT_DIR="${PI_CODING_AGENT_DIR:-$HOME/.config/pi/agent}"
          if [ -e "$HOME/.pi/agent" ] && [ ! -L "$HOME/.pi/agent" ] && [ -d "$AGENT_DIR" ]; then
            echo "::warning::both ~/.pi/agent and $AGENT_DIR exist; the agent dir was not migrated."
          fi

          echo "Verifying shell configs are managed by chezmoi, contain PI_OFFLINE and set the Pi agent dir..."
          if [ "${{ runner.os }}" == "Linux" ]; then
            for rc in "$HOME/.bashrc" "$HOME/.zshrc"; do
              if [ ! -f "$rc" ]; then
                echo "::error::$rc not found"
                exit 1
              fi
              grep -q "managed by chezmoi" "$rc" || {
                echo "::error::$rc not managed by chezmoi"
                exit 1
              }
              grep -q "PI_OFFLINE" "$rc" || {
                echo "::error::PI_OFFLINE not set in $rc"
                exit 1
              }
              grep -q "PI_CODING_AGENT_DIR" "$rc" || {
                echo "::error::PI_CODING_AGENT_DIR not set in $rc"
                exit 1
              }
            done
          elif [ "${{ runner.os }}" == "macOS" ]; then
            if [ ! -f "$HOME/.zshrc" ]; then
              echo "::error::.zshrc not found"
              exit 1
            fi
            grep -q "managed by chezmoi" "$HOME/.zshrc" || {
              echo "::error::.zshrc not managed by chezmoi"
              exit 1
            }
            grep -q "PI_OFFLINE" "$HOME/.zshrc" || {
              echo "::error::PI_OFFLINE not set in $HOME/.zshrc"
              exit 1
            }
            grep -q "PI_CODING_AGENT_DIR" "$HOME/.zshrc" || {
              echo "::error::PI_CODING_AGENT_DIR not set in $HOME/.zshrc"
              exit 1
            }
          fi

          echo "Verifying the managed fish config..."
          FISH_CONFIG="$HOME/.config/fish/config.fish"
          if [ ! -f "$FISH_CONFIG" ]; then
            echo "::error::$FISH_CONFIG not found"
            exit 1
          fi
          grep -q "managed by chezmoi" "$FISH_CONFIG" || {
            echo "::error::$FISH_CONFIG not managed by chezmoi"
            exit 1
          }
          grep -q "PI_OFFLINE" "$FISH_CONFIG" || {
            echo "::error::PI_OFFLINE not set in $FISH_CONFIG"
            exit 1
          }
          grep -q "PI_CODING_AGENT_DIR" "$FISH_CONFIG" || {
            echo "::error::PI_CODING_AGENT_DIR not set in $FISH_CONFIG"
            exit 1
          }

          echo "Verifying Homebrew..."
          if [ "${{ runner.os }}" == "Linux" ]; then
             # Prefer the root-free prefix the dotfiles install into
             if [ -d "$HOME/.linuxbrew" ]; then
               eval "$($HOME/.linuxbrew/bin/brew shellenv)"
             elif [ -d "/home/linuxbrew/.linuxbrew" ]; then
               eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
             fi
          fi

          if command -v brew >/dev/null; then
            echo "brew is available."
            brew list
          else
            echo "::warning::brew not found or not in PATH."
          fi

          echo "Verifying applied state with chezmoi verify..."
          chezmoi verify --source "$GITHUB_WORKSPACE" --exclude=scripts

      - name: Idempotency Check (re-run must retry what is missing)
        run: |
          ./install.sh | tee rerun.log
          # The install scripts are unconditional (run_before_*/run_after_*, not
          # run_onchange_*), so a second apply must reach them again. Move them
          # back to run_onchange_* and this step fails.
          grep -q 'Installing Packages via Homebrew' rerun.log \
            || { echo '::error::brew installer did not run on the second apply'; exit 1; }
          if [ "${{ runner.os }}" = "Linux" ]; then
            grep -q 'Installing Linux Binaries (No-Admin)' rerun.log \
              || { echo '::error::binary installer did not run on the second apply'; exit 1; }
          fi
          echo 'Installers re-run on every apply: OK.'
        env:
          CI: true

  test-devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install Dev Container CLI
        run: npm install -g @devcontainers/cli

      - name: Build and Run Dev Container
        run: |
          # Start the dev container.
          # This will run the onCreateCommand (./install.sh) inside the container.
          devcontainer up --workspace-folder .
        env:
          CI: true

      - name: Verify Dev Container Setup
        run: |
          # Check for chezmoi, pi-bolt, and shell configs inside the container.
          # zsh is the default shell, so .zshrc must be present and managed.
          devcontainer exec --workspace-folder . bash -c "
            export PATH=\$HOME/.local/bin:\$PATH
            for bin in chezmoi pi-bolt; do
              if command -v \$bin >/dev/null; then
                echo \"\$bin found\";
              else
                echo \"\$bin not found\"; exit 1;
              fi
            done

            for rc in ~/.bashrc ~/.zshrc; do
              if [ -f \$rc ]; then
                echo \"\$rc found\";
                grep -q 'managed by chezmoi' \$rc || { echo \"\$rc not managed by chezmoi\"; exit 1; }
                grep -q 'PI_OFFLINE' \$rc || { echo \"PI_OFFLINE not set in \$rc\"; exit 1; }
              else
                echo \"\$rc not found\"; exit 1;
              fi
            done
          "
